# Rule-based sector -> Nova tier mapping.
# Applies to every project whose CSV "sector" value is NOT one of the 8
# sectors sent to the LLM for per-project classification (see scripts/03_classify.py:
# LLM_SECTORS). Edit freely -- 03_classify.py re-reads this file on every run.
#
# Tiers: T1 (makes UPF) / T2 (UPF input or packaging) / T3 (distributes/retails UPF)
#        / CONTESTED (infant formula, fortified staples, therapeutic foods) / N (none of the above)
#
# BORDERLINE CALLS -- reviewed once, flagged here for a domain expert to confirm or override:
#   - "Sugar and Confectionery": IFC's sector label conflates raw/refined sugar (T2) with
#     confectionery (T1). Defaulted to T1 since "confectionery" is the more specific term
#     and Sugarcane/Beets (raw cane growing) is already a separate sector coded N.
#   - "Packaged Food": generic label, defaulted to T1 as the closest proxy for Nova group 4;
#     could include some non-UPF packaged goods (e.g. plain canned vegetables).
#   - "Grain Processing (Milling, Starch, Flour, Malt)": defaulted to T2 because industrial
#     starch is an explicit T2 example, but this sector also covers plain flour/malt milling
#     (Nova group 1/2, not really UPF-specific). Reasonable to reclassify some/all as N.
#   - "Seafood Product Preparation and Packaging": defaulted to N (treated like "fresh meat
#     and fish"), but could arguably belong with the Fruit/Veg preservation LLM-review group.

sector_tiers:
  # --- T1: makes ultra-processed food or drink (3 sectors) ---
  "Packaged Food": T1
  "Soft Drink": T1
  "Sugar and Confectionery": T1

  # --- T2: supplies inputs/packaging predominantly used by UPF makers (5 sectors) ---
  "Grain Processing (Milling, Starch, Flour, Malt)": T2
  "Metal Can and Other Metal Container (Including Aluminum Beverage Cans)": T2
  "Palm Vegetable Oil": T2
  "Sugar Refining and Sweetener Production": T2
  "Vegetable Fats and Oils": T2

  # --- T3: distributes or retails UPF at scale (3 sectors) ---
  "Grocery Retail (Supermarkets, Hypermarkets, Convenience Stores etc.)": T3
  "Retail (Including Supermarkets, Grocery Stores, etc.)": T3
  "Wholesale (Including Grocery and Farm Products)": T3

  # --- N: none of the above (primary agriculture, non-food, etc.) (179 sectors) ---
